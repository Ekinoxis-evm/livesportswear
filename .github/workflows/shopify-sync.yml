# Intraday Shopify sales sync — hourly, so the dashboard's per-employee and
# per-store sales are never more than ~an hour behind the register. Runs at
# :30 to dodge GitHub's top-of-hour scheduler congestion; off-hours runs are
# cheap no-op curls. Lives here because the Vercel plan only allows once-daily
# crons; the daily 06:00 UTC safety-net run stays in vercel.ts.
name: shopify-sync
on:
  schedule:
    - cron: "30 * * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger sync endpoint
        run: |
          curl -fsS -m 120 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://livesportswear.vercel.app/api/cron/shopify-sync"
